name: Deploy to Prod server

on:
  push:
    branches:
      - main
  workflow_dispatch:  # allow manual trigger too

jobs:
  deploy:
    runs-on: ubuntu-latest
  
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MYDEVIL_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.MYDEVIL_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy to MyDevil.net
        id: deploy
        run: |
          set -e
          ssh ${{ secrets.MYDEVIL_USER }}@${{ secrets.MYDEVIL_HOST }} -p 443 << 'EOF'
          set -e
          cd ~/domains/${{ secrets.MYDEVIL_PROD_DOMAIN_NAME }}/public_python
          if [ ! -d .git ]; then
            echo "🔧 First-time setup: cloning repository..."
            git clone git@github.com:Marcin-Rybarczyk/flbb-statistics-public.git .
          else
            echo "📦 Pulling latest changes..."
            git pull origin main
          fi
          devil www restart ${{ secrets.MYDEVIL_PROD_DOMAIN_NAME }}
          EOF

      - name: 🧾 Deployment Summary
        if: success()
        run: |
          echo "✅ **Deployment successful!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Repository: [${{ github.repository }}](https://github.com/${{ github.repository }})" >> $GITHUB_STEP_SUMMARY
          echo "🌐 Host: ${{ secrets.MYDEVIL_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "🕐 Commit: ${{ github.event.head_commit.id }}" >> $GITHUB_STEP_SUMMARY
          echo "💬 Message: ${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY
